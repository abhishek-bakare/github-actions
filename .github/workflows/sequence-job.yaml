name: Generate sequence jobs ASCII art

on: 
    push

jobs:
    first_ascii_job1:
        runs-on: ubuntu-latest
        steps:
              
            - name: Install cowsay 
              run: sudo apt-get install cowsay -y     

            - name: Execute cowsay cmd
              run: cowsay -f dragon "Run for cover, I am a Dragon....RAWW" >> dragon.txt 
            
            - name: Upload a file                 #we use here upload actions to upload a file
              uses: actions/upload-artifact@v4
              with:
                name: dragon-text-file
                path: dragon.txt

    test_ascii_job2:
        needs: first_ascii_job1                   # shows this job is depends on earlier job
        runs-on: ubuntu-latest
        steps: 
            - name: Download a file               #we use here download actions to download a file for next job
              uses: actions/download-artifact@v4
              with:
                name: dragon-text-file
              
            - name: Check file exist
              run: grep -i "Dragon" dragon.txt
            
    deploy_job_3:
        needs: [first_ascii_job1, test_ascii_job2]
        runs-on: ubuntu-latest
        steps:

            - name: Download a file               #we use here download actions to download a file for next job
              uses: actions/download-artifact@v4
              with:
                name: dragon-text-file

            - name: Read file
              run: cat dragon.txt
              
            - name: Deploy
              run: echo "Deploying......"    

